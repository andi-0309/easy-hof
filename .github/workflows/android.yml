name: Android & Wear OS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true
  DART_SUPPRESS_ANALYTICS: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: python3 tools/check_voice_assets.py
      - run: flutter --suppress-analytics analyze
      - run: flutter --suppress-analytics test test/breathing_test.dart test/widget_test.dart test/audio_assets_test.dart test/nordic_layout_test.dart
      - run: flutter --suppress-analytics test --dart-define=WEAR=true test/wear_test.dart
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - name: Derive release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/release_version.py "$RELEASE_TAG"
      - name: Configure private release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] && { [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$SIGNING_ALIAS" ] || [ -z "$SIGNING_PASSWORD" ]; }; then
            echo "::error::Tagged releases require all four ANDROID signing secrets. See docs/RELEASING.md."
            exit 1
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easy-hof.jks"
            chmod 600 "$RUNNER_TEMP/easy-hof.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/easy-hof.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build watch APK first
        shell: bash
        run: |
          args=()
          if [ -n "${RELEASE_VERSION:-}" ]; then args+=(--build-name "$RELEASE_VERSION" --build-number "$RELEASE_CODE"); fi
          flutter --suppress-analytics build apk --release --flavor wear --dart-define=WEAR=true "${args[@]}"
      - name: Bundle watch installer in phone variant only
        run: |
          mkdir -p android/app/src/phone/assets/wear
          cp build/app/outputs/flutter-apk/app-wear-release.apk android/app/src/phone/assets/wear/easy-hof-wear.apk
      - name: Build phone APK with the same signing identity and version
        shell: bash
        run: |
          args=()
          if [ -n "${RELEASE_VERSION:-}" ]; then args+=(--build-name "$RELEASE_VERSION" --build-number "$RELEASE_CODE"); fi
          flutter --suppress-analytics build apk --release --flavor phone "${args[@]}"
      - name: Verify bundled watch installer
        run: python3 tools/check_apk_bundle.py build/app/outputs/flutter-apk/app-phone-release.apk build/app/outputs/flutter-apk/app-wear-release.apk
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-phone-release.apk dist/easy-hof-phone.apk
          cp build/app/outputs/flutter-apk/app-wear-release.apk dist/easy-hof-wear.apk
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*
          if-no-files-found: error
      - name: Verify native persistence and sync merge rules
        working-directory: android
        run: ./gradlew :app:testPhoneDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: easy-hof-phone-dev
          path: build/app/outputs/flutter-apk/app-phone-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: easy-hof-wear-dev
          path: build/app/outputs/flutter-apk/app-wear-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove private signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/easy-hof.jks"
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Easy Hof $RELEASE_TAG"
