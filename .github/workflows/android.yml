name: Android & Wear OS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true
  DART_SUPPRESS_ANALYTICS: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: python3 tools/check_voice_assets.py
      - run: python3 tools/test_release_version.py
      - run: flutter --suppress-analytics analyze
      - run: flutter --suppress-analytics test test/breathing_test.dart test/widget_test.dart test/audio_assets_test.dart test/nordic_layout_test.dart test/play_store_test.dart
      - run: flutter --suppress-analytics test --dart-define=WEAR=true test/wear_test.dart
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - name: Derive shared version and distinct form-factor codes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 tools/release_version.py "$RELEASE_TAG"
      - name: Configure private release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] && { [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$SIGNING_ALIAS" ] || [ -z "$SIGNING_PASSWORD" ]; }; then
            echo "::error::Tagged releases require all four ANDROID signing secrets. See docs/RELEASING.md."
            exit 1
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easy-hof.jks"
            chmod 600 "$RUNNER_TEMP/easy-hof.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/easy-hof.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build watch APK
        shell: bash
        run: |
          flutter --suppress-analytics build apk --release --flavor wear --dart-define=WEAR=true --build-name "$RELEASE_VERSION" --build-number "$WEAR_CODE"
      - name: Build phone APK with the same signing identity and version
        shell: bash
        run: |
          flutter --suppress-analytics build apk --release --flavor phone --build-name "$RELEASE_VERSION" --build-number "$PHONE_CODE"
      - name: Verify Android package identity in both APKs
        shell: bash
        run: |
          for flavor in phone wear; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "build/app/outputs/flutter-apk/app-$flavor-release.apk" > "$RUNNER_TEMP/$flavor-badging.txt"
            grep -F "package: name='io.github.andi_0309.easyhof'" "$RUNNER_TEMP/$flavor-badging.txt"
          done
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-phone-release.apk dist/easy-hof-phone.apk
          cp build/app/outputs/flutter-apk/app-wear-release.apk dist/easy-hof-wear.apk
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*
          if-no-files-found: error
      - name: Verify native persistence and sync merge rules
        working-directory: android
        run: ./gradlew :app:testPhoneDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: easy-hof-phone-dev
          path: build/app/outputs/flutter-apk/app-phone-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: easy-hof-wear-dev
          path: build/app/outputs/flutter-apk/app-wear-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build Play Store phone and watch bundles
        if: env.KEYSTORE_PATH != ''
        shell: bash
        run: |
          flutter --suppress-analytics build appbundle --release --flavor phone --build-name "$RELEASE_VERSION" --build-number "$PHONE_CODE"
          flutter --suppress-analytics build appbundle --release --flavor wear --dart-define=WEAR=true --build-name "$RELEASE_VERSION" --build-number "$WEAR_CODE"
          mkdir -p dist-play
          cp build/app/outputs/bundle/phoneRelease/app-phone-release.aab dist-play/easy-hof-phone.aab
          cp build/app/outputs/bundle/wearRelease/app-wear-release.aab dist-play/easy-hof-wear.aab
          cd dist-play
          sha256sum *.aab > PLAY-SHA256SUMS
      - name: Download pinned Google bundletool
        if: env.KEYSTORE_PATH != ''
        run: |
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar --output "$RUNNER_TEMP/bundletool.jar"
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Verify Play bundle identity, form factors, versions and private signing
        if: env.KEYSTORE_PATH != ''
        run: python3 tools/check_play_bundles.py --phone dist-play/easy-hof-phone.aab --wear dist-play/easy-hof-wear.aab --bundletool "$RUNNER_TEMP/bundletool.jar"
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_PATH != ''
        with:
          name: play-store-bundles
          path: dist-play/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove private signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/easy-hof.jks"
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: play-store-bundles
          path: dist-play
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release create "$RELEASE_TAG" dist/* dist-play/* --verify-tag --generate-notes --title "Easy Hof $RELEASE_TAG"
