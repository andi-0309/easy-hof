name: Android & Wear OS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true
  DART_SUPPRESS_ANALYTICS: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter --suppress-analytics analyze
      - run: flutter --suppress-analytics test test/breathing_test.dart test/widget_test.dart
      - run: flutter --suppress-analytics test --dart-define=WEAR=true test/wear_test.dart
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - name: Configure optional private signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easy-hof.jks"
            chmod 600 "$RUNNER_TEMP/easy-hof.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/easy-hof.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build phone APK
        run: flutter --suppress-analytics build apk --release --flavor phone
      - name: Build watch APK with the same signing identity
        run: flutter --suppress-analytics build apk --release --flavor wear --dart-define=WEAR=true
      - name: Verify native persistence and sync merge rules
        working-directory: android
        run: ./gradlew :app:testPhoneDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: easy-hof-phone-dev
          path: build/app/outputs/flutter-apk/app-phone-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: easy-hof-wear-dev
          path: build/app/outputs/flutter-apk/app-wear-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove private signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/easy-hof.jks"
