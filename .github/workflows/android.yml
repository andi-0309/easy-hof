name: Android & Wear OS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_play:
        description: Als Entwurf nach Google Play hochladen
        type: boolean
        required: false
        default: false
env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true
  DART_SUPPRESS_ANALYTICS: true
  GCP_PROJECT_ID: rock-arc-514408-k3
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/470971669836/locations/global/workloadIdentityPools/easy-hof-github/providers/github
  GCP_SERVICE_ACCOUNT: easy-hof-github@rock-arc-514408-k3.iam.gserviceaccount.com
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: python3 tools/check_voice_assets.py
      - name: Check public and offline privacy copies stay in sync
        run: |
          python3 tools/generate_privacy_policy.py
          git diff --exit-code -- PRIVACY.md assets/privacy
      - run: python3 tools/test_release_version.py
      - run: python3 tools/test_play_access.py
      - run: flutter --suppress-analytics analyze
      - run: flutter --suppress-analytics test test/breathing_test.dart test/widget_test.dart test/audio_assets_test.dart test/nordic_layout_test.dart test/play_store_test.dart test/privacy_test.dart test/manual_cold_test.dart test/manual_locale_test.dart test/training_history_test.dart test/nordic_release_test.dart test/breathing_design_test.dart test/nordic_buttons_test.dart test/companion_test.dart test/interface_refinement_test.dart
      - run: flutter --suppress-analytics test --dart-define=WEAR=true test/wear_test.dart test/interface_refinement_test.dart test/manual_cold_test.dart test/training_history_test.dart test/nordic_release_test.dart
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - name: Derive shared version and distinct form-factor codes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 tools/release_version.py "$RELEASE_TAG"
      - name: Configure private release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] && { [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$SIGNING_ALIAS" ] || [ -z "$SIGNING_PASSWORD" ]; }; then
            echo "::error::Tagged releases require all four ANDROID signing secrets. See docs/RELEASING.md."
            exit 1
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easy-hof.jks"
            chmod 600 "$RUNNER_TEMP/easy-hof.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/easy-hof.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build watch APK
        shell: bash
        run: |
          flutter --suppress-analytics build apk --release --flavor wear --dart-define=WEAR=true --build-name "$RELEASE_VERSION" --build-number "$WEAR_CODE"
      - name: Build phone APK with the same signing identity and version
        shell: bash
        run: |
          flutter --suppress-analytics build apk --release --flavor phone --build-name "$RELEASE_VERSION" --build-number "$PHONE_CODE"
      - name: Verify Android package identity in both APKs
        shell: bash
        run: |
          for flavor in phone wear; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "build/app/outputs/flutter-apk/app-$flavor-release.apk" > "$RUNNER_TEMP/$flavor-badging.txt"
            grep -F "package: name='io.github.andi_0309.easyhof'" "$RUNNER_TEMP/$flavor-badging.txt"
          done
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-phone-release.apk dist/easy-hof-phone.apk
          cp build/app/outputs/flutter-apk/app-wear-release.apk dist/easy-hof-wear.apk
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*
          if-no-files-found: error
      - name: Verify native persistence and sync merge rules
        working-directory: android
        run: ./gradlew :app:testPhoneDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: easy-hof-phone-dev
          path: build/app/outputs/flutter-apk/app-phone-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: easy-hof-wear-dev
          path: build/app/outputs/flutter-apk/app-wear-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build Play Store phone and watch bundles
        if: env.KEYSTORE_PATH != ''
        shell: bash
        run: |
          flutter --suppress-analytics build appbundle --release --flavor phone --build-name "$RELEASE_VERSION" --build-number "$PHONE_CODE"
          flutter --suppress-analytics build appbundle --release --flavor wear --dart-define=WEAR=true --build-name "$RELEASE_VERSION" --build-number "$WEAR_CODE"
          mkdir -p dist-play
          cp build/app/outputs/bundle/phoneRelease/app-phone-release.aab dist-play/easy-hof-phone.aab
          cp build/app/outputs/bundle/wearRelease/app-wear-release.aab dist-play/easy-hof-wear.aab
          cd dist-play
          sha256sum *.aab > PLAY-SHA256SUMS
      - name: Download pinned Google bundletool
        if: env.KEYSTORE_PATH != ''
        run: |
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar --output "$RUNNER_TEMP/bundletool.jar"
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Verify Play bundle identity, form factors, versions and private signing
        if: env.KEYSTORE_PATH != ''
        run: python3 tools/check_play_bundles.py --phone dist-play/easy-hof-phone.aab --wear dist-play/easy-hof-wear.aab --bundletool "$RUNNER_TEMP/bundletool.jar"
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_PATH != ''
        with:
          name: play-store-bundles
          path: dist-play/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove private signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/easy-hof.jks"
  verify_play:
    name: Verify Google Play access
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      phone_track: ${{ steps.tracks.outputs.phone_track }}
      wear_track: ${{ steps.tracks.outputs.wear_track }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with short-lived Google credentials
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Check permissions and discover phone and Wear internal tracks
        id: tracks
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 tools/check_play_access.py
  upload_play:
    name: Upload Google Play drafts
    needs: [build, verify_play]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_play)
    runs-on: ubuntu-latest
    concurrency:
      group: google-play-io.github.andi_0309.easyhof
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: play-store-bundles
          path: dist-play
      - name: Authenticate immediately before uploading
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Upload phone draft
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: io.github.andi_0309.easyhof
          releaseFiles: dist-play/easy-hof-phone.aab
          tracks: ${{ needs.verify_play.outputs.phone_track }}
          status: draft
      - name: Upload Wear OS draft
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: io.github.andi_0309.easyhof
          releaseFiles: dist-play/easy-hof-wear.aab
          tracks: ${{ needs.verify_play.outputs.wear_track }}
          status: draft
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: play-store-bundles
          path: dist-play
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          notes=(--generate-notes)
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
          fi
          gh release create "$RELEASE_TAG" dist/* dist-play/* --verify-tag "${notes[@]}" --title "Easy Hof $RELEASE_TAG"
